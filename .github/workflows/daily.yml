name: Post StockCharts Advancers & Decliners

on:
  repository_dispatch:
    types: [cron-post]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - name: Show trigger info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "action=${{ github.event.action }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install dependencies
        run: npm ci

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STOCKCHARTS_USERNAME: ${{ secrets.STOCKCHARTS_USERNAME }}
          STOCKCHARTS_PASSWORD: ${{ secrets.STOCKCHARTS_PASSWORD }}
        run: npm run post

      # Discord already succeeded if a PNG exists; never fail the job if git write-back fails.
      - name: Commit screenshot to repo
        if: success() || failure()
        run: |
          set -euo pipefail
          trap 'echo "::warning::Failed to save screenshot to git (Discord post is unchanged)"; exit 0' ERR

          if [ ! -d screenshots ]; then
            echo "No screenshot PNG to commit"
            exit 0
          fi

          shopt -s nullglob
          pngs=(screenshots/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then
            echo "No screenshot PNG to commit"
            exit 0
          fi

          git config --global --add safe.directory "${GITHUB_WORKSPACE:-$(pwd)}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${pngs[@]}"

          if git diff --cached --quiet; then
            echo "Screenshot files unchanged"
            exit 0
          fi

          git commit -m "Save StockCharts screenshot $(TZ=Asia/Hong_Kong date +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
