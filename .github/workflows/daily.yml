name: Post StockCharts Advancers & Decliners

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STOCKCHARTS_USERNAME: ${{ secrets.STOCKCHARTS_USERNAME }}
          STOCKCHARTS_PASSWORD: ${{ secrets.STOCKCHARTS_PASSWORD }}
        run: npm run post
